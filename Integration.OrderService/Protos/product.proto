syntax = "proto3";

option csharp_namespace = "Integration.OrderService.Protos";

package product;

// Контракт Product Service. Студенты реализуют gRPC-клиент в ProductClient.
service ProductService {
  rpc CheckProduct (CheckProductRequest) returns (CheckProductResponse);
}

message CheckProductRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message CheckProductResponse {
  string product_id = 1;
  string name = 2;
  string price = 3;
  int32 stock = 4;
  bool is_available = 5;
}
